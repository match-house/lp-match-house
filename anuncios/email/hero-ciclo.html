<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url("../lp-main/_ds/match-house-design-system-a2408f83-cade-4df4-bc51-545884a020be/fonts/Poppins-Regular.ttf");font-weight:400}
@font-face{font-family:P;src:url("../lp-main/_ds/match-house-design-system-a2408f83-cade-4df4-bc51-545884a020be/fonts/Poppins-SemiBold.ttf");font-weight:600}
@font-face{font-family:P;src:url("../lp-main/_ds/match-house-design-system-a2408f83-cade-4df4-bc51-545884a020be/fonts/Poppins-ExtraBold.ttf");font-weight:800}
body{margin:0}
/* Vertical (1200×1600): no e-mail do celular a imagem fica com ~340 px de
   largura, então o texto da arte tem de ser grande (Mateus, 08/11: "algo que
   convença mais... uma coisa alimenta a outra... com gráfico"). */
#hero{width:1200px;height:1600px;position:relative;overflow:hidden;font-family:P,Arial,sans-serif;
 background:radial-gradient(1000px 1000px at 50% 66%,#1b2fd6 0%,#000f90 50%,#00073e 100%);color:#fff}
.topo{position:absolute;left:84px;top:72px;right:84px}
.logo{height:64px;display:block;margin-bottom:56px}
.k{font-weight:600;letter-spacing:.14em;font-size:34px;color:#00efff;text-transform:uppercase}
h1{font-weight:800;font-size:84px;line-height:1.04;margin:18px 0 0;letter-spacing:-.015em}
h1 em{font-style:normal;color:#00efff}
#ciclo{position:absolute;left:0;top:590px;width:1200px;height:1000px}
.no{position:absolute;width:420px;text-align:center}
.ic{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-family:"Noto Color Emoji";font-size:74px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.35);position:relative}
.n{position:absolute;top:-4px;right:-4px;width:54px;height:54px;border-radius:50%;background:#00efff;color:#000f90;
 font-family:P;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.no b{display:block;font-size:42px;line-height:1.1;font-weight:800}
.no span{display:block;font-size:31px;line-height:1.25;color:#d3d9ff;margin-top:6px}
.centro{position:absolute;left:450px;top:330px;width:300px;text-align:center}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:150px}
.bars i{display:block;width:40px;border-radius:9px 9px 3px 3px;background:linear-gradient(#00efff,#00a8d8)}
.centro b{display:block;margin-top:16px;font-size:36px;font-weight:800;line-height:1.12}
</style></head><body>
<div id="hero">
 <div class="topo"><img class="logo" src="logo-dark.png" alt="">
  <div class="k">Uma coisa alimenta a outra</div>
  <h1>Seu Instagram traz o cliente. <em>Sua IA atende na hora.</em></h1>
 </div>
 <div id="ciclo">
  <svg width="1200" height="1000" viewBox="0 0 1200 1000" style="position:absolute;left:0;top:0">
   <defs><marker id="seta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#00efff"/></marker></defs>
   <g fill="none" stroke="#00efff" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 20">
    <path d="M790,95 A430,430 0 0 1 960,300" marker-end="url(#seta)"/>
    <path d="M960,650 A430,430 0 0 1 705,790" marker-end="url(#seta)"/>
    <path d="M495,790 A430,430 0 0 1 240,650" marker-end="url(#seta)"/>
    <path d="M240,300 A430,430 0 0 1 410,95" marker-end="url(#seta)"/>
   </g>
  </svg>
  <div class="no" style="left:390px;top:0"><div class="ic">📱<div class="n">1</div></div><b>Instagram</b><span>Seu Smart Link é o 1º link da bio</span></div>
  <div class="no" style="left:760px;top:320px"><div class="ic">🏠<div class="n">2</div></div><b>Smart Link</b><span>Quem toca vê os seus imóveis</span></div>
  <div class="no" style="left:390px;top:700px"><div class="ic">🤖<div class="n">3</div></div><b>Sua IA</b><span>Atende na hora e pega nome e celular</span></div>
  <div class="no" style="left:20px;top:320px"><div class="ic">💙<div class="n">4</div></div><b>Novos seguidores</b><span>Quem chega pelo link segue você</span></div>
  <div class="centro"><div class="bars"><i style="height:50px"></i><i style="height:84px"></i><i style="height:116px"></i><i style="height:150px"></i></div><b>mais clientes atendidos</b></div>
 </div>
</div>
</body></html>
