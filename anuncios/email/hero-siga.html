<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url("../lp-main/_ds/match-house-design-system-a2408f83-cade-4df4-bc51-545884a020be/fonts/Poppins-Regular.ttf");font-weight:400}

body{margin:0}
#hero{width:1200px;height:600px;position:relative;overflow:hidden;font-family:P,Arial,sans-serif;
 background:radial-gradient(900px 600px at 85% 30%,#1b2fd6 0%,#000f90 45%,#00073e 100%);color:#fff}
.txt{position:absolute;left:72px;top:96px;width:520px}
.logo{height:56px;display:block;margin-bottom:56px}
.k{font-weight:600;letter-spacing:.14em;font-size:22px;color:#00efff;text-transform:uppercase}

p{font-size:26px;line-height:1.4;margin:0;color:#c9d0ff}
.phone{position:absolute;right:70px;top:60px;width:430px;height:720px;border-radius:56px;background:#0b0f2a;

.screen{background:#fff;border-radius:40px;height:100%;overflow:hidden;color:#111}
.ig{display:flex;align-items:center;gap:16px;padding:26px 22px 14px}
.av{width:78px;height:78px;border-radius:50%;background:#000f90 url(logo-dark.png) center/70% no-repeat;border:3px solid #00efff}
.nm{font-weight:600;font-size:22px}.bt{margin-top:6px;display:inline-block;background:#0095f6;color:#fff;font-weight:600;font-size:17px;padding:6px 22px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:8px}
.grid div{aspect-ratio:4/5;background-size:cover;background-position:center}
