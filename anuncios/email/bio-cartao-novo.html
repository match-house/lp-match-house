<html><head><style>
@font-face{font-family:P;src:url(Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:P;src:url(Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(Poppins-Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:radial-gradient(120% 90% at 50% 0%,#14207a 0%,#0a1040 55%,#060a28 100%);font-family:P,sans-serif;color:#fff;padding:48px 60px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.pill{position:absolute;top:52px;right:60px;background:#22d3ee;color:#06112e;font-weight:700;font-size:24px;letter-spacing:.06em;padding:8px 20px;border-radius:999px;text-transform:uppercase}
h1{font-size:58px;line-height:1.1;font-weight:700}
h1 span{color:#22d3ee}
.lbl{font-size:24px;font-weight:600;color:#9fb3ff;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.ig{background:#1c1c1e;border-radius:28px;padding:20px;display:flex;gap:22px;align-items:center}
.thumb{width:132px;height:132px;border-radius:18px;background:url(card.png) center/251px 132px no-repeat;flex:none}
.ig b{display:block;font-size:38px;font-weight:600}
.ig i{font-style:normal;font-size:27px;color:#a1a1aa}
.wa{background:#1f2c34;border-radius:28px;padding:12px;width:760px}
.wa img{width:100%;display:block;border-radius:18px 18px 0 0}
.wa .t{background:#182229;border-radius:0 0 18px 18px;padding:16px 20px 18px}
.wa .t b{display:block;font-size:30px;font-weight:600;line-height:1.25}
.wa .t p{font-size:22px;color:#aebac1;line-height:1.35;margin-top:4px}
.wa .t s{display:block;text-decoration:none;font-size:20px;color:#8696a0;margin-top:6px}
</style></head><body>
<div class="pill">Exemplo</div>
<h1>Seu link <span>de cara nova</span></h1>
<div><div class="lbl">No Instagram</div>
<div class="ig"><div class="thumb"></div><div><b>Fale com a minha IA</b><i>smartli.ink/camiladuarte</i></div></div></div>
<div><div class="lbl">No WhatsApp</div>
<div class="wa"><img src="card.png"><div class="t"><b>Fale com a IA da Camila</b><p>Veja os imóveis, tire suas dúvidas e marque sua visita. A IA da Camila responde na hora, inclusive à noite e no fim de semana.</p><s>smartli.ink</s></div></div></div>
</body></html>
